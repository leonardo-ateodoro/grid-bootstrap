<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Componentes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" defer></script>

</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand " href="#">Bootstrap Componentes</a>
            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menuPrincipal">

                    <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Home
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Serviços 
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="#">
                            Contato
                        </a>
                    </li>

                </ul>
            </div>

        </div>
    </nav>


    <main class="container flex-grow-1 d-flex flex-column justify-content-center py-5">
        <section class="mb-5">
            <div class="row g-4">

                <div class="col-md-4">

                    <div class="bg-primary text-white p-4 rounded shadow h-100 text-center">

                        <h2>
                            Layout
                        </h2>

                        <p>
                            Organização utilizando o sistema do grid do Bootstrap.
                        </p>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="bg-dark text-white p-4 rounded shadow h-100 text-center">

                        <h2>
                            Componentes
                        </h2>

                        <p>
                            Utilização de navbar, carousel e footer.
                        </p>
                    </div>
                </div>


                <div class="col-md-4">
                    <div class="bg-danger text-white p-4 rounded shadow h-100 text-center">

                        <h2>
                            Responsividade
                        </h2>

                        <p>
                            Estrutura adaptada para diferentes tamanhos de tela.
                        </p>
                    </div>
                </div>
            </div>
        </section>


        <section>

            <div id="carouselProjeto" class="carousel slide">

                <div class="carousel-inner rounded shadow">

                    <div class="carousel-item active">
                        <img 
                        src="https://picsum.photos/1200/400?random=10"
                        class="d-block w-100"
                        alt="Imagem 1">
                    </div>

                    <div class="carousel-item">
                        <img 
                        src="https://picsum.photos/1200/400?random=11" 
                        class="d-block w-100"
                        alt="Imagem 2">
                    </div>

                    <div class="carousel-item">
                        <img 
                        src="https://picsum.photos/1200/400?random=12" 
                        class="d-block w-100"
                        alt="Imagem 3">
                    </div>
                </div>

                <button
                class="carousel-control-prev"
                type="button"
                data-bs-target="#carouselProjeto"
                data-bs-slide="prev"
                >
                    <span class="carousel-control-prev-icon"></span>
                </button>

                <button
                class="carousel-control-next"
                type="button"
                data-bs-target="#carouselProjeto"
                data-bs-slide="next"
                >
                    <span class="carousel-control-prev-icon"></span>
                </button>

            </div>
        </section>

    </main>


    <footer class="bg-dark text-white text-center p-4">

        <p class="m-0">
            Desenvolvido para estudos com Bootstrap
        </p>
    </footer>
    
</body>
</html>
